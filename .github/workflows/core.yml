name: Core without client extensions

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_sqlite
          tools: composer:v2
      - run: php bin/prepare-composer.php
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.core.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
